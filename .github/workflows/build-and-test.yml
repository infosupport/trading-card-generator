name: Build and Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Restore backend dependencies
        run: dotnet restore --locked-mode 

      - name: Build backend API
        run: dotnet build InfoSupport.TradingCardGenerator.sln --no-restore --configuration Release

      - name: Restore frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: src/InfoSupport.TradingCardGenerator.Web
      
      - name: Build frontend
        run: npm run build
        working-directory: src/InfoSupport.TradingCardGenerator.Web
        
      - name: Run tests
        run: dotnet test InfoSupport.TradingCardGenerator.sln --no-build --configuration Release --verbosity normal --filter "Category!=Integration"
